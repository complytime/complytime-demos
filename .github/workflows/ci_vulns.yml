name: Vulnerabilities Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: none
  id-token: none
  security-events: none
  packages: none

jobs:
  call_reusable_vuln_scan:
    name: OSV-Scanner
    permissions:
      contents: read
      actions: read           # Needed to upload SARIF file to CodeQL. See: https://github.com/github/codeql-action/issues/2117
      security-events: write  # Needed to upload the results to code-scanning dashboard.
    uses: complytime/org-infra/.github/workflows/reusable_vuln_scan.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
