name: Compliance Checks

# Only allow manual trigger during testing phase. Above lines will be uncommented when testing is complete.
on:
  workflow_dispatch:
    inputs:
      complytime_config_path:
        description: 'Relative path of the complytime configuration file in this repository'
        required: false
        type: string
        default: '.complytime/complytime.yaml'
      policy_id:
        description: 'Policy ID to use for complyctl generate and scan commands'
        required: false
        type: string
        default: 'ampel-bp'

permissions:
  contents: read
  actions: none
  id-token: none
  attestations: none

jobs:
  call_reusable_compliance:
    name: Compliance Evaluation
    permissions:
      contents: read
    uses: complytime/org-infra/.github/workflows/reusable_compliance.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    with:
      complytime_config_path: ${{ inputs.complytime_config_path || '.complytime/complytime.yaml' }}
      policy_id: ${{ inputs.policy_id || 'ampel-bp' }}
    secrets:
      source_token: ${{ secrets.GITHUB_TOKEN }}
